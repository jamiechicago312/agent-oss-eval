name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tracked documentation
        run: |
          test -s README.md
          test -s PLAN.md

      - name: Check committed whitespace errors
        run: git diff --check "$(git rev-list --max-parents=0 HEAD)" HEAD

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify CLI
        run: test "$(node dist/cli/index.js version)" = "oss-eval 0.1.0"

      - name: Verify packed package
        run: npm run package:smoke
